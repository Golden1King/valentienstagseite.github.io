<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Briefumschläge – Vergangenheit, Gegenwart, Zukunft</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@1,700&display=swap" rel="stylesheet">

  <style>
    /* Grundstil für den Body */
    body {
      background-color: #ffe6f0; /* Leicht rosa Hintergrund */
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    /* Überschrift */
    h1 {
      margin-bottom: 20px;
    }
    /* Container für die Umschläge */
    .envelopes {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 600px;
    }
    /* Stil für jeden Umschlag */
    .envelope {
      cursor: pointer;
      text-align: center;
    }
    /* Stil für das Emoji */
    .envelope-emoji {
      font-size: 64px;
      transition: transform 0.3s;
      display: inline-block;
    }
    .envelope:hover .envelope-emoji {
      transform: scale(1.1);
    }
    /* Beschriftung unter dem Emoji */
    .envelope span.label {
      display: block;
      margin-top: 5px;
      font-weight: bold;
    }
    /* Overlay für den geöffneten Brief */
    .letter-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      display: none; /* Standardmäßig nicht sichtbar */
      align-items: center;
      justify-content: center;
    }
    .letter-content {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 90%;
      max-height: 80%;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
    /* Kleiner "X"-Knopf in der rechten oberen Ecke */
    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      font-size: 24px;
      line-height: 1;
      color: #333;
      cursor: pointer;
    }
    /* Brieftext mit Garamond-Stil */
    #letterText {
      font-family: 'EB Garamond', serif;
      font-weight: 700; /* Bold */
      font-style: italic;
      font-size: 22px;
      line-height: 1.6;
      text-align: justify;
    }

  


  </style>
</head>
<body>
  <h1>Wähle einen Briefumschlag</h1>
  <div class="envelopes">
    <!-- Umschlag für die Vergangenheit -->
    <div class="envelope" onclick="openLetter('vergangenheit')">
      <span class="envelope-emoji">✉️</span>
      <span class="label">Vergangenheit</span>
    </div>
    <!-- Umschlag für die Gegenwart -->
    <div class="envelope" onclick="openLetter('gegenwart')">
      <span class="envelope-emoji">✉️</span>
      <span class="label">Gegenwart</span>
    </div>
    <!-- Umschlag für die Zukunft -->
    <div class="envelope" onclick="openLetter('zukunft')">
      <span class="envelope-emoji">✉️</span>
      <span class="label">Zukunft</span>
    </div>
    <!-- Geheimer Brief (initial versteckt) -->
    <div class="envelope" id="secretEnvelope" onclick="openLetter('secret')" style="display: none;">
      <span class="envelope-emoji">✉️</span>
      <span class="label">Geheimer Brief</span>
    </div>
  </div>

  
  <!-- Overlay für den geöffneten Brief -->
  <div class="letter-overlay" id="letterOverlay">
    <div class="letter-content" id="letterContent">
      <!-- Kleiner "X"-Schließen-Knopf -->
      <button class="close-btn" onclick="closeLetter()">X</button>
      <div id="letterText">
        <!-- Hier wird der Brieftext (oder das Video) dynamisch eingefügt -->
      </div>
    </div>
  </div>

  <!-- Audio-Elemente -->
  <!-- Hintergrundmusik (autoplay & loop) -->
  <audio id="bgMusic" src="Sounds/background.mp3" autoplay loop></audio>
  <!-- Soundeffekt beim Öffnen -->
  <audio id="openSound" src="Sounds/open-sound.mp3"></audio>
  <!-- Soundeffekt beim Schließen -->
  <audio id="closeSound" src="Sounds/close-sound.mp3"></audio>

  <script>
    /*Background sound*/
   // document.getElementById('bgMusic').play();
    /* Brieftexte für die drei Zeiträume */
    const letters = {
      vergangenheit: "Liebe Ali,\nVor ungefähr sechs Monaten sah ich dich das erste Mal, und seitdem ist alles anders – besser anders.\nAls ich mit Clemens auf das Sängerfest ging, habe ich erwartet, dass ich mich betrinken und Spaß haben werde – was ich auch tat.\nDoch ich habe nicht erwartet, dich zu treffen. Ein Treffen, das am Anfang vielleicht unscheinbar war, aber einen großen Impact hatte.\nAls wir im Kreis standen, konnte ich meinen Blick kaum von dir wenden. Ich wusste nicht, warum, doch es war so. Da war ein Gefühl, das ich nicht beschreiben konnte. Auch im Laufe des Tages ging es nicht weg, und so suchte ich Gespräche mit dir – und lowkey habe ich auch probiert zu flexen, haha.\nDann unterhielten wir uns am Abend so schön, und ich dachte: Wow, dieses Mädchen ist toll, Leonard hat einfach gewonnen. Und es wurde noch besser, als wir miteinander tanzten und so unglaublich viel Spaß hatten. Die ganze Zeit dachte ich: Wow, was für ein wunderbarer Mensch. Doch zugleich spielte in meinem Kopf der Gedanke: So kannst du nicht denken, sie hat einen Freund. Also versuchte ich, diese Gedanken zu verdrängen. Als du mich dann fragtest, wie ich dich finde, konnte ich nicht ehrlich sein und log. Ich konnte nicht zugeben, dass ich ein vergebenes Mädchen toll finde. Doch glaube mir, als du mich zu deinem und Leonards Geburtstag eingeladen hast, habe ich mich so unglaublich gefreut – wirklich riesig.\nUnd dann war unser Treffen schon vorbei. Etwas Zeit verging, und ich verdrängte die Gedanken, die ich hatte.\nDoch dann fingen Clemens und Jonas an, Witze zu machen, dass du mich magst. Ich verneinte es und wollte es nicht wahrhaben. Es war einfach zu surreal.\nUnd dann kam euer Geburtstag. Ich wollte unbedingt gehen, aber auch nicht – denn in meinem Kopf waren so viele Gedanken. Gedanken, für die ich mich schämte, denn ich mochte dich, aber du hattest einen Freund. Ich kam trotzdem, denn ich wollte dich – euch – unbedingt sehen.\nAuf eurem Geburtstag hatten wir eine wunderbare Zeit, und mit jeder Stunde fühlte ich mich dir verbundener. Und dann, in der Nacht, waren wir so nah und doch so fern. Jede Nähe suchend, die möglich war, doch ich wollte keine Grenzen überschreiten. Und wie der Rest der Nacht verlief, weißt du auch.\nSeitdem, seit dieser Nacht, schreiben wir fast täglich. Wir treffen uns jedes Wochenende, und ich kann endlich sagen, dass du meine Freundin bist. Ich darf sagen Ich liebe dich, und das fühlt sich so gut an. Am Anfang hat sich alles wie ein Märchen angefühlt, und ich war der Gewinner, der eine Prinzessin bekommt. (Ich habe auch ziemlich viel mit dir angegeben.)\nJede Fahrt hat sich gelohnt. Jedes Wochenende habe ich genossen. Jedes Mal, wenn du in Nürnberg warst, bist du tiefer in mein Herz gekommen.\nAli, ich bin unendlich froh, dass ich dich damals angestarrt habe und noch viel glücklicher über alles, was danach passiert ist. Wenn die Zeit zurückspringen würde, dann würde ich alles genau gleich machen – nur um wieder eine Chance bei dir zu haben.\n- Sascha",
      gegenwart: "Liebe Ali,/nes gibt nun ein Wir, und du bist nun ein Teil meines Lebens – und das ist so wunderbar. Du bist eine Bereicherung jeden Tag – mit deinem Lächeln, mit deinem Lachen, mit jeder Umarmung und jedem Wort./nAuch wenn noch nicht jede Angst weg ist, weiß ich, dass wir diese gemeinsam bewältigen werden. Vertrauen und Ehrlichkeit sind die Basis unserer Beziehung, und darauf möchte ich aufbauen./nWir sind im Jetzt, doch leider vergeht jedes Jetzt mit dir viel zu schnell. Aber ich trauere nicht, denn ich weiß, dass das nächste Jetzt mit dir schon bald folgt. Die Schönheit dieses Moments möchte ich nicht mit der Trauer um einen vergangenen Moment beschatten./nDu hast mein Vertrauen gewonnen, und mein Herz liegt in deiner Hand. Ich fürchte das aber nicht, denn ich weiß, wem ich es gegeben habe – und das beruhigt mich sehr./nAlle Probleme, Ängste und Sorgen, die du jetzt hast, werden wir überwinden und in Zukunft nicht mehr daran denken. Denn wir sind da füreinander./n- Sascha",
      zukunft: "Dies ist der Brief der Zukunft. Hier kannst du Visionen und Hoffnungen für das, was noch kommt, entdecken."
    };

    // Objekt zur Verfolgung, ob die einzelnen Briefe bereits geöffnet wurden
    let openedLetters = {
      vergangenheit: false,
      gegenwart: false,
      zukunft: false
    };

    /**
     * Öffnet den Brief, der dem übergebenen Schlüssel entspricht.
     * Spielt den passenden Soundeffekt ab und blendet das Overlay ein.
     * Falls der geheime Brief geöffnet wird, wird das YouTube-Video eingebettet.
     * @param {string} letterKey - 'vergangenheit', 'gegenwart', 'zukunft' oder 'secret'
     */
    function openLetter(letterKey) {
      // Spiele den Soundeffekt für das Öffnen
      document.getElementById('openSound').play();

      // Falls es nicht der geheime Brief ist, als geöffnet markieren
      if (letterKey !== 'secret') {
        openedLetters[letterKey] = true;
      }

      // Überprüfe, ob alle drei normalen Briefe bereits geöffnet wurden
      if (openedLetters.vergangenheit && openedLetters.gegenwart && openedLetters.zukunft) {
        // Zeige den geheimen Umschlag an
        document.getElementById('secretEnvelope').style.display = 'inline-block';
      }

      const letterTextEl = document.getElementById('letterText');

      if (letterKey === 'secret') {
        // Statt Text, YouTube-Video einbetten (Rickroll)
        letterTextEl.innerHTML = '<iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
      } else {
        // Andernfalls den passenden Brieftext anzeigen
        letterTextEl.innerText = letters[letterKey] || "Kein Text vorhanden.";
      }

      // Blende das Overlay ein
      document.getElementById('letterOverlay').style.display = 'flex';
    }

    /**
     * Schließt das geöffnete Brief-Overlay.
     * Spielt den passenden Soundeffekt ab.
     */
    function closeLetter() {
      // Spiele den Soundeffekt für das Schließen
      document.getElementById('closeSound').play();
      // Verberge das Overlay
      document.getElementById('letterOverlay').style.display = 'none';
      // Optional: Leere den Inhalt, damit beim erneuten Öffnen ggf. das Video nicht weiterläuft
      document.getElementById('letterText').innerHTML = '';
    }
  </script>
</body>
</html>
